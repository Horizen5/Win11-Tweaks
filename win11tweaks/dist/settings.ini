; ============================================================
;  Win11 / Win10  顺手设置  ——  开关文件
;  ------------------------------------------------------------
;  用法：改本文件 -> 双击 运行.cmd  -> 立即生效（无需重装系统）
;
;  取值：1 = 开启该设置
;        0 = 还原为系统默认（不写该项）
;
;  注意：
;   · 本文件必须与本脚本同目录；找不到时全部按 1（开启）执行。
;   · 用记事本编辑后请"另存为 -> 编码选 ANSI 或 UTF-8"均可。
;   · Win10 上没有的项目会自动跳过（如任务栏居左、Win10 右键菜单）。
; ============================================================; ------------------------------------------------------------
;  [Shell] 任务栏 / 右键菜单 / 资源管理器
; ------------------------------------------------------------
[Shell]
; 任务栏靠左（Win11 专用；Win10 本就靠左，会自动跳过）
TaskbarAlignLeft   = 1
; 合并任务栏按钮并隐藏标签
;   始终   = 合并按钮 + 隐藏标签（Win11 默认）
;   已满时 = 任务栏满了才合并
;   从不   = 不合并 + 始终显示窗口标题（像 Win10 那样）
TaskbarCombine     = 始终
; 隐藏任务栏搜索框
HideSearchBox      = 1
; 隐藏任务视图按钮
HideTaskView       = 1
; 隐藏小组件（Win11 左下角天气）
HideWidgets        = 1
; 隐藏"聊天/继续"按钮（Win11 专用）
HideChat           = 1
; 时钟显示秒
ShowSeconds        = 1
; 隐藏托盘上的通知铃铛
HideNotificationBell = 1
; 资源管理器默认打开"此电脑"
ExplorerOpenThisPC = 1
; 右键菜单换成 Win10 完整版（Win11 专用）
Win10ContextMenu   = 1


; ------------------------------------------------------------
;  [Desktop] 桌面图标 / 排列 / 角标
; ------------------------------------------------------------
[Desktop]
; 桌面显示"此电脑"
ShowThisPC         = 1
; 桌面显示"回收站"
ShowRecycleBin     = 1
; 桌面显示"控制面板"
ShowControlPanel   = 1
; 桌面自动排列图标
AutoArrange        = 1
; 自动排列时是否对齐到网格（0=不对齐）
AlignToGrid        = 1
; 桌面按名称排序（此电脑排最前）
SortByName         = 1
; 去除快捷方式左下角小箭头
HideShortcutArrow  = 1
; 去除 UAC 盾牌角标（只隐藏图标，提权提示依然存在）
HideUACShield      = 1
; 新建快捷方式时不带" - 快捷方式"后缀
NoShortcutSuffix   = 1


; ------------------------------------------------------------
;  [Theme] 深浅色 / 壁纸
; ------------------------------------------------------------
[Theme]
; 是否应用主题设置（0 = 不动主题）
ApplyTheme         = 1
; 任务栏/开始菜单 用深色（0 = 浅色）
SystemDark         = 1
; 应用窗口 用深色（0 = 浅色，即"任务栏深 + 应用浅"的混合模式）
AppsDark           = 0
; 固定壁纸，关闭聚焦轮播
FixedWallpaper     = 1


; ------------------------------------------------------------
;  [Notify] 通知 / 建议
; ------------------------------------------------------------
[Notify]
; 关闭通知中心 + 弹窗
DisableNotificationCenter = 1
; 关闭通知总开关
DisableToasts      = 1
; 关闭专注助手（免打扰）
DisableQuietHours  = 1
; 关闭消费级建议 / 锁屏广告 / 开始菜单推荐
DisableConsumerFeatures = 1


; ------------------------------------------------------------
;  [StartRecommended] 设置 -> 个性化 -> 开始 -> 推荐
;  这三个开关默认全部「关闭」（就是图1的效果）
; ------------------------------------------------------------
[StartRecommended]
; 显示最近添加的应用          -> 关
ShowRecentlyAddedApps = 0
; 在"开始"菜单中显示推荐的文件、"文件资源管理器"中的最新文件、跳转列表项 -> 关
ShowRecommendedFiles = 0
; 显示有关提示、快捷方式、新应用等的建议   -> 关
ShowRecommendationTips = 0


; ------------------------------------------------------------
;  [StartFolders] 设置 -> 个性化 -> 开始 -> 文件夹
;  在电源按钮旁边显示哪些文件夹（就是图2的效果）
;  取值：1 = 显示，0 = 不显示
;  下面是"只保留 设置/文件资源管理器/下载 三个"的配置
; ------------------------------------------------------------
[StartFolders]
; 设置
FolderSettings = 1
; 文件资源管理器
FolderFileExplorer = 1
; 下载
FolderDownloads = 1
; 文档
FolderDocuments = 0
; 音乐
FolderMusic = 0
; 图片
FolderPictures = 0
; 视频
FolderVideos = 0
; 网络
FolderNetwork = 0
; 用户个人文件夹（用户名文件夹）
FolderPersonal = 0

